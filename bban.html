<!DOCTYPE html>
<html>
<head>
  <title>Product List Using map()</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f0f2f5;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    .product-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 200px;
      text-align: center;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .price {
      color: green;
    }
  </style>
</head>
<body>

  <h2>🛍 Product List</h2>
  <div class="product-list" id="productContainer"></div>

  <script>
    // Product data (real-life scenario)
    const products = [
      { name: "T-Shirt", price: 499 },
      { name: "Shoes", price: 1299 },
      { name: "Watch", price: 999 },
      { name: "Headphones", price: 799 }
    ];

    const container = document.getElementById("productContainer");

    // map() se HTML generate karna
    const productCards = products.map(product => {
      return `
        <div class="card">
          <div class="name">${product.name}</div>
          <div class="price">₹${product.price}</div>
        </div>
      `;
    });

    // Show cards in container
    container.innerHTML = productCards.join("");
  </script>

</body>
</html>
